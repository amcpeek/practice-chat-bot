<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat Bot</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
    #log { border: 1px solid #ccc; height: 240px; overflow-y: auto; padding: 0.5rem; margin-bottom: 0.5rem; }
    .msg { margin: 0.25rem 0; }
    .msg.user { color: #06c; }
    .msg.server { color: #080; }
    form { display: flex; gap: 0.5rem; }
    input[type="text"] { flex: 1; padding: 0.5rem; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Chat Bot</h1>
  <div id="log"></div>
  <form id="form">
    <input type="text" id="input" placeholder="Type a message..." autocomplete="off" />
    <button type="submit">Send</button>
  </form>

  <script>
    const log = document.getElementById('log');
    const input = document.getElementById('input');
    const form = document.getElementById('form');

    function addMsg(role, text) {
      const el = document.createElement('div');
      el.className = 'msg ' + role;
      el.textContent = (role === 'user' ? 'You: ' : 'Server: ') + text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    const ws = new WebSocket((location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws');

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'history') {
        data.messages.forEach(m => addMsg(m.role, m.text));
      } else if (data.type === 'message') {
        addMsg(data.user.role, data.user.text);
        addMsg(data.server.role, data.server.text);
      }
    };

    form.onsubmit = (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || ws.readyState !== WebSocket.OPEN) return;
      ws.send(text);
      input.value = '';
    };
  </script>
</body>
</html>
